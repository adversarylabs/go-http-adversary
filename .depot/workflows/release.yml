name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test tagged source
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  push:
    name: Bump manifest and push
    needs: test
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Synchronize release metadata
        id: version
        # domain/name catalog id support
        uses: adversarylabs/actions/version@9d990ebe8956cfe876331d21798d53e71c134c66
        with:
          tag: ${{ github.ref_name }}
          path: .
          branch: main
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          sync-npm: auto

      - name: Push adversary
        # domain/name remote refs
        uses: adversarylabs/actions/push@9d990ebe8956cfe876331d21798d53e71c134c66
        with:
          # beta.1 rejects permissions.model; pin stable CLI.
          cli-version: 2026.7.26
          path: .
          token: ${{ secrets.ADVERSARY_SERVICE_ACCOUNT_TOKEN }}
          # CI is the publish authority — full catalog path, no adversarylabs/ prefix.
          remote-reference: registry.adversarylabs.ai/${{ steps.version.outputs.name }}:${{ steps.version.outputs.version }}
          push-latest: true
